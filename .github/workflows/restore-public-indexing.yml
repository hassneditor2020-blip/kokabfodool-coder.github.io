name: Restore public indexing on SEO branch
on:
  push:
    branches: [development/seo-indexing-restoration]
    paths: ['.github/workflows/restore-public-indexing.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/seo-indexing-restoration
      - name: Restore public pages and validate
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          from html.parser import HTMLParser
          root=pathlib.Path('.')
          urls=[x.text for x in ET.parse('sitemap.xml').findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==344 and len(set(urls))==344
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.canonical=[]; self.robots=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a.get('href'))
                  if tag=='meta' and a.get('name','').lower()=='robots': self.robots.append(a.get('content',''))
          changes=[]
          for url in urls:
              u=urlsplit(url)
              assert u.scheme=='https' and u.netloc=='kokabfodool.com' and u.path.endswith('/') and '..' not in u.path
              p=root/u.path.lstrip('/')/'index.html'
              s=p.read_text(encoding='utf-8')
              head=Head(); head.feed(s)
              assert head.canonical==[url], (p, head.canonical)
              temporary=['<meta content="noindex,follow" name="robots"/>','<meta name="robots" content="noindex,follow"/>']
              new=s
              for tag in temporary: new=new.replace(tag,'')
              if not any('index' in v.lower() and 'noindex' not in v.lower() for v in head.robots):
                  new=new.replace('</head>','<meta name="robots" content="index,follow,max-image-preview:large"/>\n</head>',1)
              head=Head(); head.feed(new)
              assert not any('noindex' in v.lower() for v in head.robots), (p,head.robots)
              if s!=new: changes.append((p,new))
          for p,new in changes: p.write_text(new,encoding='utf-8')
          print(f'Validated {len(urls)} canonical public pages, restored {len(changes)} pages; non-sitemap pages untouched.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Restore indexing on canonical public sitemap pages"
            git push origin HEAD:development/seo-indexing-restoration
          fi
