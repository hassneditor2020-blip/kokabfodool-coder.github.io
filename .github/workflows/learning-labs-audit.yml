name: Audit learning labs
on:
  push:
    branches: [development/learning-labs-v37]
    paths: ['.github/workflows/learning-labs-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check preserved educational data
        run: |
          python3 - <<'PY'
          import pathlib,re,json,subprocess
          for prefix in ['', 'en/']:
              for game in ['counting','trace','lumaa-clock','planet-engineer']:
                  p=prefix+'games/'+game+'/index.html'
                  old=subprocess.check_output(['git','show','origin/main:'+p],text=True)
                  new=pathlib.Path(p).read_text()
                  pattern=r'<script id="game-data"[^>]*>([\s\S]*?)</script>'
                  assert json.loads(re.search(pattern,old)[1])==json.loads(re.search(pattern,new)[1]),p
                  assert 'noindex' not in re.search(r'<head>[\s\S]*?</head>',new)[0],p
          print('Eight bilingual pages preserve all lesson data and indexing')
          PY
          for f in assets/games.js assets/game-extra.js assets/interactive-games.js assets/planet-adventures.js; do node --input-type=module --check < "$f"; done
      - name: Test four laboratories in Chromium
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let pages;
          for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<90;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const click=sel=>ev("document.querySelector("+JSON.stringify(sel)+").click();true");
          const check=(v,m)=>{if(!v)throw Error(m)};
          const fit="document.documentElement.scrollWidth<=innerWidth+4";
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['','en/']){
              await nav(pre+'games/counting/?level=1',"document.querySelector('.count-lab-value')");
              await click('.count-token');check(await ev("document.querySelector('.count-lab-value').textContent==='1'"),'count one');
              await click('.count-token');check(await ev("document.querySelector('.count-lab-value').textContent==='0'"),'untap');
              await ev("document.querySelectorAll('.count-token').forEach(b=>b.click());true");check(await ev("document.querySelector('.count-lab-value').textContent==='2'"),'count two');
              await click('.count-reset');check(await ev("document.querySelector('.count-lab-value').textContent==='0'"),'count reset');
              await ev("Array.from(document.querySelectorAll('[data-options] button')).find(b=>b.textContent==='2').click();true");
              check(await ev("!document.querySelector('[data-next]').hidden && "+fit),'count answer');
              await ev('localStorage.clear();true');
              await nav(pre+'games/trace/?level=1',"document.querySelector('.trace-palette')");
              await click('.trace-color:nth-child(2)');check(await ev("document.querySelector('.trace-color:nth-child(2)').getAttribute('aria-pressed')==='true'"),'ink selection');
              const draw=async()=>{const r=await ev("(()=>{const c=document.querySelector('.extra-trace canvas');c.scrollIntoView({block:'center'});const r=c.getBoundingClientRect();return {x:r.left+r.width*.25,y:r.top+r.height*.4,w:r.width}})()");await cmd('Input.dispatchMouseEvent',{type:'mousePressed',x:r.x,y:r.y,button:'left',buttons:1,clickCount:1});await cmd('Input.dispatchMouseEvent',{type:'mouseMoved',x:r.x+r.w*.3,y:r.y+10,button:'left',buttons:1});await cmd('Input.dispatchMouseEvent',{type:'mouseReleased',x:r.x+r.w*.3,y:r.y+10,button:'left',buttons:0,clickCount:1})};
              await draw();check(await ev("!document.querySelector('.trace-actions .button-primary').disabled"),'drawing');
              await click('.trace-actions button:first-child');check(await ev("document.querySelector('.trace-actions .button-primary').disabled"),'undo');
              await draw();await click('.trace-actions button:nth-child(2)');check(await ev("document.querySelector('.trace-actions .button-primary').disabled"),'clear');
              await draw();await click('.trace-actions .button-primary');check(await ev("!document.querySelector('[data-next]').hidden && "+fit),'trace completion');
              await ev('localStorage.clear();true');
              await nav(pre+'games/lumaa-clock/?level=1',"document.querySelector('.clock-digital')");
              check(await ev("document.querySelector('.clock-digital').textContent==='--:--' && document.querySelectorAll('.lesson-clock text').length===12"),'clock initial');
              await ev("Array.from(document.querySelectorAll('.clock-answer')).find(b=>b.textContent==='2:00').click();true");
              check(await ev("document.querySelector('[data-feedback]').dataset.state==='wrong'"),'clock wrong');
              await ev("Array.from(document.querySelectorAll('.clock-answer')).find(b=>b.textContent==='1:00').click();true");
              check(await ev("document.querySelector('.clock-digital').textContent==='1:00' && !document.querySelector('[data-next]').hidden && "+fit),'clock answer');
              await ev('localStorage.clear();true');
              await nav(pre+'games/planet-engineer/?level=1',"document.querySelector('.engineering-feature .geo-art')");
              const ans=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds[0].answer");
              await ev("Array.from(document.querySelectorAll('[data-options] button')).find(b=>b.textContent==="+JSON.stringify(ans)+").click();true");
              check(await ev("!document.querySelector('[data-next]').hidden && "+fit),'geometry answer');
              await click('[data-next]');
              await poll("document.querySelector('.engineering-lab .planet-blank')");
              const pat=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds[1].answer");
              await ev("Array.from(document.querySelectorAll('[data-options] button')).find(b=>b.getAttribute('aria-label')==="+JSON.stringify(pat)+").click();true");
              check(await ev("document.querySelector('.planet-pattern-item[data-completed=true] .geo-art') && !document.querySelector('[data-next]').hidden && "+fit),'pattern answer');
              await ev('localStorage.clear();true');
              console.log(width,pre||'ar','counting, trace, clock, engineering passed');
            }
          }
          ws.close();console.log('16 bilingual learning lab scenarios passed');
          JS
