name: Fudool Pages Android 16 offline smoke test
on:
  push:
    branches: [qa/fudool-pages-android]
permissions:
  contents: read
  actions: read
jobs:
  story:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Kawkab-Fudool-Google-Play-Signed-6.8.1
          path: build/play
          run-id: 44076147135
          github-token: ${{ github.token }}
      - run: cd build/play && sha256sum -c SHA256SUMS
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -memory 2048 -cores 2
          script: bash scripts/test-play-stories.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fudool-Pages-Android-16-Evidence
          path: build/play-device/
