name: Fudool V6.7 settings and Android verification
on:
  push:
    branches: [development/app-settings-v67]
    paths-ignore:
      - 'downloads/apps/**'
  workflow_dispatch:
concurrency:
  group: fudool-worlds-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      kind: ${{ steps.signing.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Static preflight
        run: |
          python3 scripts/verify-v5.py
          python3 scripts/verify-seo.py
          python3 scripts/verify-learning-presence.py
          node --check assets/app-v5.js
          bash -n scripts/build-android.sh
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare signing key
        id: signing
        env:
          RELEASE_BUNDLE: ${{ secrets.FUDOOL_RELEASE_BUNDLE }}
          RELEASE_KEY_B64: ${{ secrets.FUDOOL_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.FUDOOL_KEY_ALIAS }}
          RELEASE_STORE: ${{ secrets.FUDOOL_STORE_PASSWORD }}
          RELEASE_PASS: ${{ secrets.FUDOOL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/fudool-signing.jks"
          if [ -n "$RELEASE_BUNDLE" ]; then
            python3 - "$KEY" <<'PY'
          import os,sys,json,base64,pathlib
          b=json.loads(base64.b64decode(os.environ['RELEASE_BUNDLE'].strip(),validate=True))
          assert b['certificate_sha256']=='ee4e5f8887447d750263ce35798c3c0c0e5a7a01a03d678712ad49d48abdb729'
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(b['keystore_base64'],validate=True))
          for k,v in [('FUDOOL_KEY_ALIAS',b['alias']),('FUDOOL_STORE_PASSWORD',b['store_password']),('FUDOOL_KEY_PASSWORD',b['key_password']),('FUDOOL_CERT_SHA256',b['certificate_sha256'])]:
              assert '\n' not in v and '\r' not in v
              if 'PASSWORD' in k: print('::add-mask::'+v)
              with open(os.environ['GITHUB_ENV'],'a') as f: f.write(k+'='+v+'\n')
          PY
            echo "kind=release" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_KEY_B64" ]; then
            test -n "$RELEASE_ALIAS" && test -n "$RELEASE_STORE" && test -n "$RELEASE_PASS"
            printf '%s' "$RELEASE_KEY_B64" | base64 -d > "$KEY"
            echo "FUDOOL_KEY_ALIAS=$RELEASE_ALIAS" >> "$GITHUB_ENV"
            echo "FUDOOL_STORE_PASSWORD=$RELEASE_STORE" >> "$GITHUB_ENV"
            echo "FUDOOL_KEY_PASSWORD=$RELEASE_PASS" >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo 'Original release signing secret is required.' >&2
            exit 1
          fi
          chmod 600 "$KEY"
          echo "FUDOOL_KEYSTORE=$KEY" >> "$GITHUB_ENV"
          echo "FUDOOL_CERT_SHA256=ee4e5f8887447d750263ce35798c3c0c0e5a7a01a03d678712ad49d48abdb729" >> "$GITHUB_ENV"
      - name: Build the signed unified APK
        run: bash scripts/build-android.sh
      - name: Upload APKs and checksums (not website deployment)
        uses: actions/upload-artifact@v4
        with:
          name: Kokab-Fodool-V6.7-${{ steps.signing.outputs.kind }}
          path: build/android-v6/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fudool-signing.jks"

  verify:
    if: needs.build.outputs.kind == 'release' && github.ref_name == 'development/app-settings-v67'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-v5-browser.cjs
      - run: node scripts/test-v6-worlds.cjs
      - run: node scripts/test-v6-challenges.cjs
      - run: node scripts/test-v65-play.cjs
      - run: node scripts/test-learning-presence.cjs
      - run: node scripts/test-app-settings.cjs
      - uses: actions/download-artifact@v4
        with:
          name: Kokab-Fodool-V6.7-release
          path: build/android-v6/
      - name: Verify all advanced levels from the signed Android package
        run: |
          unzip -q build/android-v6/kawkab-fudool-unified.apk 'assets/site/*' -d build/apk-verification
          FUDOOL_TEST_ROOT=build/apk-verification/assets/site node scripts/test-v6-challenges.cjs
          FUDOOL_TEST_ROOT=build/apk-verification/assets/site node scripts/test-v65-play.cjs
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Verify Android upgrade, settings and offline game launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-v6-android.sh
      - name: Stage the verified Android package for release
        run: |
          python3 scripts/stage-v5-release.py
          python3 scripts/verify-v5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/apps/
          if ! git diff --cached --quiet; then
            git commit -m "Stage signed Kokab Fodool V6.7 APK"
            git push origin HEAD:refs/heads/development/app-settings-v67
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V6.7-gameplay-screenshots
          path: |
            build/v5-screenshots/
            build/v6-screenshots/
          if-no-files-found: ignore
          retention-days: 14
