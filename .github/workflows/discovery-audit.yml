name: Test discovery worlds
on:
  push:
    branches: [development/discovery-worlds-v36]
    paths: ['.github/workflows/discovery-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check lesson data and assets
        run: |
          python3 - <<'PY'
          import pathlib,re,json,subprocess,xml.etree.ElementTree as ET
          for prefix in ['', 'en/']:
              for game in ['memory','puzzle','word-factory','space-journey']:
                  p=prefix+'games/'+game+'/index.html'
                  old=subprocess.check_output(['git','show','origin/main:'+p],text=True)
                  new=pathlib.Path(p).read_text()
                  pattern=r'<script id="game-data"[^>]*>([\s\S]*?)</script>'
                  assert json.loads(re.search(pattern,old)[1])==json.loads(re.search(pattern,new)[1]),p
                  assert 'noindex' not in re.search(r'<head>[\s\S]*?</head>',new)[0],p
          assert len(ET.parse('assets/space-art.svg').getroot())==15
          print('Eight game pages: identical lessons and indexability; 15 space illustrations valid')
          PY
          for f in assets/games.js assets/game-extra.js assets/interactive-games.js assets/planet-adventures.js; do node --input-type=module --check < "$f"; done
      - name: Browser interaction tests
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<80;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const check=(v,m)=>{if(!v)throw Error(m)};
          const fit="document.documentElement.scrollWidth<=innerWidth+4";
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:width===360?800:900,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['','en/']){
              await nav(pre+'games/memory/?level=1',"document.querySelector('.discovery-memory .extra-memory-card')");
              await ev("(()=>{const cards=[...document.querySelectorAll('.extra-memory-card')];cards[0].click();cards.find(b=>b.dataset.image!==cards[0].dataset.image).click();return true})()");
              await poll("!document.querySelector('.extra-memory-card.revealed')");
              check(await ev("document.querySelector('.discovery-summary progress').value===0"),'memory wrong pair');
              await ev("(()=>{const cards=[...document.querySelectorAll('.extra-memory-card')];for(const name of new Set(cards.map(c=>c.dataset.image)))cards.filter(c=>c.dataset.image===name).forEach(c=>c.click());return true})()");
              check(await ev("!document.querySelector('[data-next]').hidden && document.querySelector('.discovery-summary progress').value===2 && "+fit),'memory solved');
              await ev('localStorage.clear();true');
              await nav(pre+'games/puzzle/?level=1',"document.querySelector('.discovery-puzzle .extra-piece')");
              await ev("document.querySelector('.puzzle-reference button').click();true");
              check(await ev("document.querySelector('.discovery-preview').hidden"),'puzzle preview');
              await ev("document.querySelector('.puzzle-reference button').click();true");
              await ev("(()=>{for(let i=0;i<4;i++){const p=document.querySelector('.extra-piece[data-slot='+i+']');if(Number(p.dataset.piece)!==i){p.click();document.querySelector('.extra-piece[data-piece='+i+']').click()}}return true})()");
              check(await ev("!document.querySelector('[data-next]').hidden && document.querySelector('.discovery-summary progress').value===4 && "+fit),'puzzle solve');
              await ev('localStorage.clear();true');
              await nav(pre+'games/word-factory/?level=1',"document.querySelector('.factory-letter')");
              const word=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds[0].word");
              const press=c=>ev("Array.from(document.querySelectorAll('.factory-letter')).find(b=>!b.disabled&&b.textContent==="+JSON.stringify(c)+").click();true");
              await press(word[0]);await ev("document.querySelector('.market-actions button').click();true");
              check(await ev("document.querySelectorAll('.word-slot[data-filled=true]').length===0"),'word undo');
              for(const c of word)await press(c);
              check(await ev("!document.querySelector('[data-next]').hidden && document.querySelector('.factory-joined').textContent==="+JSON.stringify(word)+" && "+fit),'word assembly');
              await ev('localStorage.clear();true');
              await nav(pre+'games/space-journey/?level=1',"document.querySelector('.space-art')");
              await poll("document.querySelector('.space-art').getBBox().width>0");
              const answer=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds[0].answer");
              await ev("Array.from(document.querySelectorAll('[data-options] button')).find(b=>b.textContent==="+JSON.stringify(answer)+").click();true");
              check(await ev("!document.querySelector('[data-next]').hidden && "+fit),'space answer');
              await ev('localStorage.clear();true');
              console.log(width,pre||'ar','memory, puzzle, word and space passed');
            }
          }
          ws.close();console.log('16 game interaction scenarios passed on mobile and desktop');
          JS
