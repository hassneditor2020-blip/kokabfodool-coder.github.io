name: Build PWA assets and offline pack
on:
  push:
    branches: [development/pwa-v40]
    paths: ['.github/workflows/pwa-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pwa-v40
          fetch-depth: 0
      - name: Generate application assets
        run: |
          python3 -m pip install -q pillow
          python3 scripts/build-pwa.py
          node --check sw.js
          node --check assets/pwa.js
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          from PIL import Image
          p=pathlib.Path
          m=json.loads(p('manifest.webmanifest').read_text())
          assert m['scope']=='/' and m['start_url']=='/' and m['display']=='standalone'
          for x in m['icons']:
              with Image.open(p(x['src'].lstrip('/'))) as im:assert str(im.width)+'x'+str(im.height)==x['sizes']
          pack=json.loads(p('offline-pack.json').read_text())
          assert len([x for x in pack['files'] if re.match(r'^/(?:en/)?games/[^/]+/$',x)])==40
          assert len(pack['files'])==len(set(pack['files']))
          for path in ['index.html','en/index.html','games/index.html','en/games/index.html']:
              s=p(path).read_text();assert 'data-pwa-slot' in s and '/manifest.webmanifest' in s
          for path in list(p('games').glob('*/index.html'))+list(p('en/games').glob('*/index.html')):
              old=subprocess.check_output(['git','show','origin/main:'+str(path)],text=True)
              new=path.read_text()
              for id in ['game-data','drive-data','match-data']:
                  pattern=rf'<script id="{id}"[^>]*>([\s\S]*?)</script>'
                  a,b=re.search(pattern,old),re.search(pattern,new)
                  if a:assert b and a[1]==b[1],path
              assert '/manifest.webmanifest' in new
          print('Manifest icons and game content validated.')
          PY
      - name: Commit generated application files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Generate install icons and offline game package"
          git push origin HEAD:development/pwa-v40
