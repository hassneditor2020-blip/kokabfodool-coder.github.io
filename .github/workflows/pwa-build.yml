name: Test installable PWA and offline gameplay
on:
  push:
    branches: [development/pwa-v40]
    paths: ['.github/workflows/pwa-build.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pwa-v40
      - name: Refresh pack
        run: |
          python3 -m pip install -q pillow
          python3 scripts/build-pwa.py
      - name: Browser tests with real network disconnected
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          export SERVER_PID=$!
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let pages;
          for(let i=0;i<60;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async(expression,n=150)=>{for(let i=0;i<n;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const check=(v,m)=>{if(!v)throw Error(m)};
          const origin='http://127.0.0.1:8765';
          const nav=async(path,ready)=>{const url=origin+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          await cmd('Page.enable');await cmd('Runtime.enable');await cmd('Network.enable');await cmd('Network.setCacheDisabled',{cacheDisabled:true});
          await cmd('Emulation.setDeviceMetricsOverride',{width:360,height:800,deviceScaleFactor:1,mobile:true});
          await nav('/app/',"document.querySelector('[data-pack-download]') && navigator.serviceWorker.controller && !document.querySelector('[data-pack-download]').disabled");
          const manifest=await cmd('Page.getAppManifest');check(manifest.url.endsWith('/manifest.webmanifest')&&!manifest.errors.some(x=>x.critical),JSON.stringify(manifest.errors));
          const errors=await cmd('Page.getInstallabilityErrors');check(errors.installabilityErrors.length===0,JSON.stringify(errors));
          console.log('Valid manifest and no Chromium installability errors');
          const list=await ev("fetch('/offline-pack.json').then(r=>r.json())");
          await ev("document.querySelector('[data-pack-download]').click();true");
          await poll("document.querySelector('[data-pack-status]').textContent.includes('محفوظة')",1800);
          const saved=await ev("(async()=>{const m=await caches.open('fudool-offline-meta-v1');const r=await m.match('/__fudool_pack__');const info=await r.json();return {info,count:(await (await caches.open(info.cache)).keys()).length}})()");
          check(saved.count===list.files.length&&saved.info.version===list.version,'incomplete package');
          console.log('Saved complete package',saved.count,saved.info.bytes);
          // Persist a real progress key, then shut down the origin server to prohibit accidental network success.
          await ev("localStorage.setItem('fudool-games-v1:counting',JSON.stringify({scores:[3],checkpoints:{},orders:{}}));true");
          process.kill(Number(process.env.SERVER_PID),'SIGTERM');
          await cmd('Network.emulateNetworkConditions',{offline:true,latency:0,downloadThroughput:0,uploadThroughput:0});
          for(const pre of ['', '/en']){
            await nav(pre+'/',"document.querySelector('[data-pwa-slot]') && document.querySelector('.pwa-install-card')");
            check(await ev("document.documentElement.scrollWidth<=innerWidth+4"),'home overflow');
            await nav(pre+'/games/',"document.querySelectorAll('[data-game-id]').length>=20");
            const gamePaths=list.files.filter(p=>new RegExp('^'+pre+'/games/[^/]+/$').test(p));
            check(gamePaths.length===20,'game paths');
            for(const path of gamePaths){
              await nav(path,"document.querySelector('[data-level-list]')?.children.length>0");
              check(await ev("document.documentElement.scrollWidth<=innerWidth+4"),'overflow '+path);
            }
            console.log('All 20 game level maps loaded offline:',pre||'ar');
            await nav(pre+'/games/sound-quiz/?level=1',"document.querySelector('.sound-play') && !document.querySelector('[data-game]').hidden");
            await ev("document.querySelector('.sound-play').click();true");
            await poll("document.querySelectorAll('.sound-option:not(:disabled)').length>=2");
            const ans=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds[0].answer");
            await ev("Array.from(document.querySelectorAll('.sound-option')).find(b=>b.dataset.soundChoice==="+JSON.stringify(ans)+").click();true");
            check(await ev("!document.querySelector('[data-next]').hidden"),'offline audio game failed');
            await ev("localStorage.removeItem('fudool-games-v1:sound-quiz');true");
            console.log('Real cached audio decoded and sound answer succeeded:',pre||'ar');
          }
          await nav('/app/',"document.querySelector('[data-pack-status]')?.textContent.includes('محفوظة')");
          check(await ev("JSON.parse(localStorage.getItem('fudool-games-v1:counting')).scores[0]===3"),'progress lost');
          await ev("document.querySelector('[data-pack-remove]').click();true");
          await poll("document.querySelector('[data-pack-status]').textContent.includes('لم تُحمّل')");
          check(await ev("JSON.parse(localStorage.getItem('fudool-games-v1:counting')).scores[0]===3"),'progress removed with cache');
          await nav('/noncached-test/',"document.querySelector('h1')?.textContent.includes('دون اتصال')");
          console.log('Offline fallback, pack removal and saved progress verified');
          ws.close();
          JS
      - name: Commit refreshed pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Refresh validated PWA offline package"; git push origin HEAD:development/pwa-v40; fi
