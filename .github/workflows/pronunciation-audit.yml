name: Apply and audit Arabic pronunciation fixes
on:
  push:
    branches: [development/pronunciation-picture-fix]
    paths: ['.github/workflows/pronunciation-audit.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/pronunciation-picture-fix
      - name: Correct and audit game data
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,pathlib,unicodedata
          root=pathlib.Path('.')
          names=dict(zip('أبتثجحخدذرزسشصضطظعغفقكلمنهوي',['أَلِف','بَاء','تَاء','ثَاء','جِيم','حَاء','خَاء','دَال','ذَال','رَاء','زَاي','سِين','شِين','صَاد','ضَاد','طَاء','ظَاء','عَيْن','غَيْن','فَاء','قَاف','كَاف','لَام','مِيم','نُون','هَاء','وَاو','يَاء']))
          marks=['َ','ِ','ُ','ْ']
          labels=['فَتْحَة','كَسْرَة','ضَمَّة','سُكُون']
          def syllable(l,v): return ('إ' if l=='أ' and v==1 else l)+marks[v]
          def speech(l,v,w): return ' . '.join([names[l]+' مَعَ '+labels[v],syllable(l,v),w])
          def read(path,id):
              p=root/path
              s=p.read_text(encoding='utf-8')
              m=re.search(r'(<script id="'+id+r'" type="application/json">)([\s\S]*?)(</script>)',s)
              assert m, path
              return p,s,m,json.loads(m.group(2))
          def save(p,s,m,d):
              p.write_text(s[:m.start(2)]+json.dumps(d,ensure_ascii=False,separators=(',',':'))+s[m.end(2):],encoding='utf-8')
          def clusters(w): return re.findall(r'[^\u064b-\u065f][\u064b-\u065f]*',w)
          def match(w,l,v): return any(x.startswith(syllable(l,v)[0]) and marks[v] in x for x in clusters(w))
          def norm(w): return unicodedata.normalize('NFC',w)
          def audio_id(r): return int(re.search(r'/(\d+)\.mp3$',r).group(1))
          p,s,m,d=read('games/vowel-drive/index.html','drive-data')
          base={r['audio']:r for lev in d['levels'][:7] for r in lev['rounds']}
          assert len(base)==84 and len({(r['letter'],r['vowel']) for r in base.values()})==84
          assert all(match(r['example'],r['letter'],r['vowel']) for r in base.values())
          print('84 letter-vowel pairs verified, 28 letters, 3 vowels')
          match_fixes=0; sound_fixes=0; hunt_fixes=0; drive_rounds=0
          for pre in ['', 'en/']:
              p,s,m,d=read(pre+'games/vowel-drive/index.html','drive-data')
              for lev in d['levels']:
                  for r in lev['rounds']:
                      assert match(r['example'],r['letter'],r['vowel']),r
                      if r.get('audio'):
                          a=base[r['audio']]
                          assert (a['letter'],a['vowel'],norm(a['example']))==(r['letter'],r['vowel'],norm(r['example'])),r
                          drive_rounds+=1
              p,s,m,d=read(pre+'games/letter-match/index.html','match-data')
              for l in names:
                  item=d['letters'][l]
                  w=item['example'];assert w.startswith(syllable(l,0)),(l,w)
                  item['cue']=syllable(l,0)
                  item['speech']=speech(l,0,w)
                  old=item.pop('audio',None)
                  if old:
                      a=base[audio_id(old)]
                      if a['letter']==l and a['vowel']==0 and norm(a['example'])==norm(w):item['audioFallback']=old
                      else:match_fixes+=1
                  assert item['speech'].endswith(w)
              save(p,s,m,d)
              p,s,m,d=read(pre+'games/letter-hunt/index.html','game-data')
              for lev in d['levels']:
                  for r in lev['rounds']:
                      if isinstance(r,dict) and '/vowel-drive-audio-v3/' in r.get('audio',''):
                          a=base[audio_id(r['audio'])]
                          assert r['choices'][r['answer']]==a['letter'],r
                          r['speech']=speech(a['letter'],a['vowel'],a['example'])
                          r['speechLang']='ar-SA';r['audioFallback']=r.pop('audio')
                          hunt_fixes+=1
              save(p,s,m,d)
          p,s,m,d=read('games/sound-quiz/index.html','game-data')
          for lev in d['levels']:
              for r in lev['rounds']:
                  if '/vowel-drive-audio-v3/' in r.get('audio',''):
                      a=base[audio_id(r['audio'])]
                      w=r['speech']
                      assert norm(w)==norm(a['example']),r
                      assert r['answer'] in range(len(r['choices']))
                      r['speech']=speech(a['letter'],a['vowel'],w);r['speechLang']='ar-SA'
                      r['audioFallback']=r.pop('audio')
                      sound_fixes+=1
          save(p,s,m,d)
          assert sound_fixes==24 and hunt_fixes==28 and match_fixes==10
          print('Checked audio word/letter references:',sound_fixes,hunt_fixes,'mismatched matching-game recordings removed:',match_fixes,'drive audio rounds:',drive_rounds)
          pages=list(root.glob('games/*/index.html'))+list(root.glob('en/games/*/index.html'))
          assert len(pages)==40
          for p in pages:
              s=p.read_text(encoding='utf-8')
              s=s.replace('/assets/site.css?v=11','/assets/site.css?v=12').replace('/assets/game-visuals.css?v=1','/assets/game-visuals.css?v=2')
              s=s.replace('/assets/games.js?v=6','/assets/games.js?v=7').replace('/assets/letter-match.js?v=6','/assets/letter-match.js?v=7').replace('/assets/vowel-drive.js?v=7','/assets/vowel-drive.js?v=8')
              assert 'noindex' not in re.search(r'<head>[\s\S]*?</head>',s).group()
              p.write_text(s,encoding='utf-8')
          print('40 game pages cache versions updated, SEO preserved')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games en/games
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Correct audio references and refresh game artwork styles"
            git push origin HEAD:development/pronunciation-picture-fix
          fi
