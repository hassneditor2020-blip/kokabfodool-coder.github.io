name: Audit immersive games
on:
  push:
    branches: [development/immersive-games-v35]
    paths: ['.github/workflows/immersive-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify educational content preserved
        run: |
          python3 - <<'PY'
          import json,re,pathlib,subprocess,xml.etree.ElementTree as ET
          for prefix in ['', 'en/']:
              for id in ['fudool-shop','code-robo','vowel-drive']:
                  path=prefix+'games/'+id+'/index.html'
                  before=subprocess.check_output(['git','show','origin/main:'+path],text=True)
                  after=pathlib.Path(path).read_text()
                  pattern=r'<script id="(?:game-data|drive-data)"[^>]*>([\s\S]*?)</script>'
                  assert json.loads(re.search(pattern,before)[1])==json.loads(re.search(pattern,after)[1]),path
                  assert 'noindex' not in re.search(r'<head>[\s\S]*?</head>',after)[0],path
          for p in ['assets/drive-landscape.svg','assets/drive-space.svg']: ET.parse(p)
          print('Six bilingual game pages retain identical lesson data; SVGs valid and SEO preserved')
          PY
          node --input-type=module --check < assets/interactive-games.js
          node --input-type=module --check < assets/vowel-drive.js
      - name: Test actual interactive gameplay
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<100;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const check=(v,m)=>{if(!v)throw Error(m)};
          await cmd('Page.enable');await cmd('Runtime.enable');
          const click=sel=>ev("document.querySelector("+JSON.stringify(sel)+").click();true");
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:width===360?800:900,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['','en/']){
              await nav(pre+'games/fudool-shop/?level=1',"document.querySelector('.market-coin')");
              await click('[data-coin="2"]');check(await ev("document.querySelector('.market-display').textContent==='2'"),'coin not registered');
              await click('.market-actions button:first-child');check(await ev("document.querySelector('.market-display').textContent==='0'"),'undo failed');
              await click('[data-coin="1"]');await click('.market-actions .button-primary');
              check(await ev("document.querySelector('[data-feedback]').dataset.state==='wrong' && document.querySelector('.market-display').textContent==='0'"),'incorrect amount handling');
              await click('[data-coin="1"]');await click('[data-coin="2"]');await click('.market-actions .button-primary');
              check(await ev("!document.querySelector('[data-next]').hidden && document.querySelector('.market-scene').dataset.paid==='true' && document.documentElement.scrollWidth<=innerWidth+4"),'checkout failed or overflow');
              await click('[data-next]');check(await ev("document.querySelector('.market-display').textContent==='0'"),'checkout did not reset');
              await ev('localStorage.clear();true');
              await nav(pre+'games/code-robo/?level=1',"document.querySelector('.code-rover')");
              await click('[data-command="D"]');await click('.market-actions .button-primary');await poll("document.querySelector('[data-feedback]').dataset.state==='wrong'");
              check(await ev("!document.querySelector('.code-chip') && !document.querySelector('[data-command=R]').disabled"),'wrong path recovery');
              await click('[data-command="R"]');await click('[data-command="U"]');
              await click('.market-actions button:first-child');check(await ev("document.querySelectorAll('.code-chip').length===1"),'undo command');
              await click('[data-command="U"]');await click('.market-actions .button-primary');
              await poll("!document.querySelector('[data-next]').hidden && document.querySelector('.code-lab').dataset.complete==='true'");
              check(await ev("document.querySelector('.code-rover-image').naturalWidth>0 && document.documentElement.scrollWidth<=innerWidth+4"),'robot image or overflow');
              await ev('localStorage.clear();true');
              await nav(pre+'games/vowel-drive/?level=1',"document.querySelector('.drive-gate')");
              check(await ev("getComputedStyle(document.querySelector('.drive-landscape')).backgroundImage.includes('drive-landscape.svg') && document.querySelector('.drive-route-meter progress').value===0"),'road illustration or meter');
              await click('[data-vowel="1"]');check(await ev("document.querySelector('[data-drive-feedback]').dataset.state==='wrong'"),'incorrect gate');
              await click('[data-vowel="0"]');check(await ev("!document.querySelector('[data-drive-next]').hidden && document.querySelector('.drive-route-meter progress').value===1 && document.documentElement.scrollWidth<=innerWidth+4"),'correct gate or overflow');
              await poll("document.querySelector('[data-drive-scene]').dataset.driveState==='pass'");
              await click('[data-drive-next]');check(await ev("document.querySelector('.drive-route-meter progress').value===1 && !document.querySelector('[data-drive-scene]').dataset.driveState"),'route next stop');
              await ev('localStorage.clear();true');
              console.log(width,pre||'ar','shop payment/undo/wrong, robot movement/undo/wrong, drive correct/wrong/progress all passed');
            }
          }
          ws.close();console.log('12 bilingual interactive browser scenarios passed');
          JS
