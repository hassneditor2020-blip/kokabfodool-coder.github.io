name: Validate reward worlds upgrade
on:
  push:
    branches: [development/reward-worlds-v34]
    paths: ['.github/workflows/reward-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/reward-worlds-v34
      - name: Refresh pages and check data
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path('.')
          pages=list(root.glob('games/*/index.html'))+list(root.glob('en/games/*/index.html'))
          assert len(pages)==40
          counts={'ar':[0,0],'en':[0,0]}
          for p in pages+[root/'index.html',root/'en/index.html',root/'games/index.html',root/'en/games/index.html']:
              s=p.read_text()
              if '/assets/reward-worlds.css?v=1' not in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="/assets/reward-worlds.css?v=1"/>\n</head>',1)
              for name,v in [('games',9),('letter-match',9),('vowel-drive',9),('interactive-games',4),('planet-adventures',4),('game-progress',8)]:
                  s=re.sub(r'(/assets/'+name+r'\.js\?v=)\d+',lambda m:m[1]+str(v),s)
              if p in pages:
                  m=re.search(r'<script id="(?:game-data|match-data|drive-data)" type="application/json">([\s\S]*?)</script>',s)
                  assert m,p
                  d=json.loads(m[1]);lang='en' if p.parts[0]=='en' else 'ar'
                  counts[lang][0]+=len(d['levels']);counts[lang][1]+=sum(len(l['rounds']) for l in d['levels'])
              assert 'noindex' not in re.search(r'<head>[\s\S]*?</head>',s).group()
              p.write_text(s)
          assert counts=={'ar':[275,1579],'en':[275,1579]},counts
          assert all((root/'assets'/x).is_file() for x in ['lumaa.webp','robot.webp','mishal.webp'])
          print('44 pages refreshed; both languages retain 275 levels and 1579 rounds; all mascots exist and indexing retained')
          PY
          for f in assets/reward-worlds.js assets/game-progress.js assets/games.js assets/game-extra.js assets/letter-match.js assets/vowel-drive.js assets/interactive-games.js assets/planet-adventures.js; do node --input-type=module --check < "$f"; done
      - name: Browser map, rewards and score checks
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<70;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const check=(v,m)=>{if(!v)throw Error(m)};
          await cmd('Page.enable');await cmd('Runtime.enable');
          const ids=['letter-match','letter-hunt','vowel-drive','trace','counting','english-abc','robo-lab','memory','puzzle','sound-quiz','fudool-shop','word-factory','lumaa-clock','code-robo','world-mishaal','planet-engineer','healthy-hero','space-journey','spot-differences','grand-challenge'];
          await cmd('Emulation.setDeviceMetricsOverride',{width:360,height:800,deviceScaleFactor:1,mobile:true});
          for(const pre of ['','en/'])for(const id of ids){
            await nav(pre+'games/'+id+'/',"document.querySelector('.reward-map-summary') && !document.querySelector('[data-level-map]').hidden");
            const info=await ev("(()=>{const m=document.querySelector('[data-level-map]'),d=JSON.parse(document.querySelector('#game-data,#match-data,#drive-data').textContent),buttons=[...m.querySelectorAll('.game-level')];return {id:d.id,count:buttons.length,expected:d.levels.length,first:!buttons[0].disabled,locked:buttons.slice(1).every(b=>b.disabled),overflow:document.documentElement.scrollWidth>innerWidth+4,guide:!!document.querySelector('.reward-world-banner')}})()");
            check(info.id===id&&info.count===info.expected&&info.first&&info.locked&&!info.overflow&&info.guide,'Map '+pre+id+' '+JSON.stringify(info));
          }
          console.log('40 mobile level maps checked; correct locks and no horizontal overflow');
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:width===360?800:900,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['','en/'])for(const mistakes of [0,1,3]){
              await nav(pre+'games/',"document.querySelector('.reward-hub-summary')");
              await ev("localStorage.clear();localStorage.setItem('fudool-games-v1:counting',JSON.stringify({scores:[2]}));localStorage.setItem('fudool-games-v1:sound-quiz',JSON.stringify({scores:[],checkpoints:{0:{round:3,mistakes:"+mistakes+"}}}));true");
              await nav(pre+'games/sound-quiz/?level=1',"document.querySelector('[data-game]:not([hidden]) [data-options] button')");
              const answer=pre?'🐶':'🦊';
              await ev("Array.from(document.querySelectorAll('[data-options] button')).find(b=>b.getAttribute('aria-label')==="+JSON.stringify(answer)+").click();true");
              await ev("document.querySelector('[data-next]').click();true");
              await poll("document.querySelector('.reward-detail') && !document.querySelector('[data-level-result]').hidden");
              const expected=mistakes===0?3:mistakes===1?2:1;
              const result=await ev("(()=>{const r=document.querySelector('[data-level-result]'),s=JSON.parse(localStorage.getItem('fudool-games-v1:sound-quiz'));return {score:s.scores[0],stars:r.querySelectorAll('.reward-earned-stars .earned').length,all:r.querySelectorAll('.reward-earned-stars svg').length,next:!r.querySelector('[data-level-next]').hidden,overflow:document.documentElement.scrollWidth>innerWidth+4,newBadge:r.querySelector('.reward-unlock').textContent,mascot:r.querySelector('.reward-mascot').complete&&r.querySelector('.reward-mascot').naturalWidth>0}})()");
              check(result.score===expected&&result.stars===expected&&result.all===3&&result.next&&!result.overflow&&result.mascot,'Result '+JSON.stringify(result));
              check(expected!==3||/وسام جديد|New badge/.test(result.newBadge),'New badge not recognized');
              await ev("document.querySelector('[data-level-result] [data-level-menu]').click();true");
              check(await ev("!document.querySelectorAll('.game-level')[1].disabled && document.querySelectorAll('.game-level')[0].dataset.rewardState==='complete'"),'Next level not unlocked');
              await ev("localStorage.clear();true");
              console.log('Result',width,pre||'ar',expected,'stars OK');
            }
          }
          ws.close();console.log('12 real level-completion tests passed; scores, medals, progression and layouts verified');
          JS
      - name: Commit verified cache references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html en/index.html games en/games
          if ! git diff --cached --quiet; then
            git commit -m "Enable reward world visuals on all game pages"
            git push origin HEAD:development/reward-worlds-v34
          fi
