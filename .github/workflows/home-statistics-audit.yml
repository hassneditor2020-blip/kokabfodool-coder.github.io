name: Test home statistics layout
on:
  push:
    branches: [development/home-statistics-polish]
    paths: ['.github/workflows/home-statistics-audit.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser layout audit
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const width of [320,360,768,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:width<768});
            for(const pre of ['','en/']){
              const url='http://127.0.0.1:8765/'+pre;
              await cmd('Page.navigate',{url});
              for(let i=0;i<60;i++){await wait(100);if(await ev("location.href==="+JSON.stringify(url)+" && document.readyState==='complete' && !!document.querySelector('.home-stats-panel')"))break}
              const info=await ev("(()=>{const panel=document.querySelector('.home-stats-panel'),stats=[...panel.querySelectorAll('.home-stat')],actions=[...document.querySelectorAll('.home-actions a')];const r=panel.getBoundingClientRect();return {nums:stats.map(x=>x.querySelector('strong').textContent),label:stats[0].querySelector('.home-stat-label').textContent,icons:stats.every(x=>x.querySelector('svg').getBoundingClientRect().width>0),fit:stats.every(x=>x.scrollWidth<=x.clientWidth+2&&x.getBoundingClientRect().left>=r.left&&x.getBoundingClientRect().right<=r.right),separate:!panel.closest('.hero-copy')&&panel.querySelectorAll('a,button').length===0,actions:actions.map(x=>x.getAttribute('href')),overflow:document.documentElement.scrollWidth>innerWidth+4,robots:document.querySelector('meta[name=robots]').content}})()");
              if(info.nums.join(',')!=='20,275,1,579'||info.label!==(pre?'Learning games':'لعبة تعليمية')||!info.icons||!info.fit||!info.separate||info.actions.length!==4||info.overflow||info.robots.includes('noindex'))throw Error(JSON.stringify({width,pre,info}));
              console.log(width,pre||'ar',JSON.stringify(info));
            }
          }
          ws.close();console.log('8 responsive home page checks passed');
          JS
