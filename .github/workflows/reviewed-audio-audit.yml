name: Validate reviewed Arabic audio
on:
  push:
    branches: [development/approved-vowel-recordings]
    paths: ['.github/workflows/reviewed-audio-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved list and all dependent rounds
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          root=pathlib.Path('.')
          clips=json.loads(re.search(r'export const clips=(.*?);',(root/'assets/vowel-audio-review.js').read_text())[1])
          assert len(clips)==84
          blocked={8,11,12,14,22,23,25,35,36,38,52,53,58,70,74,75,80,83}
          assert {c['id'] for c in clips if c['status']=='replace'}==blocked
          assert {c['id'] for c in clips if c['status']=='approved'}==set(range(1,85))-blocked
          assert all((root/f'assets/vowel-drive-audio-v3/{c["id"]}.mp3').stat().st_size>1000 for c in clips)
          for pre in ['', 'en/']:
              d=json.loads(re.search(r'<script id="drive-data"[^>]*>([\s\S]*?)</script>',(root/(pre+'games/vowel-drive/index.html')).read_text())[1])
              rounds=[q for l in d['levels'] for q in l['rounds']]
              assert len(rounds)==261
              from collections import Counter
              print(pre or 'ar',Counter('approved' if q.get('audio') and q['audio'] not in blocked else 'visual' for q in rounds))
          print('66 approved, 18 blocked, 522 bilingual rounds preserved')
          PY
          for f in assets/vowel-audio-review.js assets/vowel-drive.js assets/game-extra.js assets/letter-match.js assets/audio-review-page.js; do node --input-type=module --check < "$f"; done
      - name: Test every recording approval in browser
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<90;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const check=(v,m)=>{if(!v)throw Error(m)};
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const pre of ['','en/']){
            await nav(pre+'games/vowel-drive/?level=1',"document.querySelector('.drive-gate')");
            await ev("window.played=[];HTMLMediaElement.prototype.play=function(){window.played.push(this.getAttribute('src'));return Promise.resolve()};true");
            const report=await ev(`(async()=>{const {approvedClips}=await import('/assets/vowel-audio-review.js?v=2');const data=JSON.parse(document.querySelector('#drive-data').textContent);let good=0,bad=0;for(const q of data.levels[0].rounds){const b=document.querySelector('[data-drive-listen]');if(b.disabled===approvedClips.has(q.audio))throw Error('wrong audio status '+q.audio);const count=window.played.length;b.click();if(approvedClips.has(q.audio)){if(window.played.at(-1)!=='/assets/vowel-drive-audio-v3/'+q.audio+'.mp3'||window.played.length!==count+1)throw Error('approved clip not played');good++}else{if(window.played.length!==count||!document.querySelector('[data-drive-prompt] mark'))throw Error('rejected clip played');bad++}document.querySelector('[data-vowel="'+q.vowel+'"]').click();document.querySelector('[data-drive-next]').click()}return {good,bad}})()`);
            check(report.good===9&&report.bad===3,JSON.stringify(report));await ev('localStorage.clear();true');
            console.log(pre||'ar',report);
          }
          const report=await ev(`(async()=>{const {playRecording}=await import('/assets/game-extra.js?v=13'),{approvedClips}=await import('/assets/vowel-audio-review.js?v=2');window.played=[];HTMLMediaElement.prototype.play=function(){window.played.push(this.getAttribute('src'));return Promise.resolve()};let rejected=0;for(let id=1;id<=84;id++){const result=await playRecording('/assets/vowel-drive-audio-v3/'+id+'.mp3',()=>rejected++);if(result!==approvedClips.has(id))throw Error('unexpected playback '+id)}return {played:window.played.length,rejected}})()`);
          check(report.played===66&&report.rejected===18,JSON.stringify(report));
          await nav('grown-ups/audio-review/',"document.querySelectorAll('.audio-review-card').length===84");
          check(await ev("document.querySelectorAll('.audio-review-card select option[value=pass]:checked').length===66 && document.querySelectorAll('.audio-review-card select option[value=replace]:checked').length===18"),'review page defaults');
          ws.close();console.log('Browser approval routing passed; playback was instrumented, not an auditory review');
          JS
