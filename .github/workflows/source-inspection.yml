name: Verify and activate repaired audio
on:
  push:
    branches: [development/vowel-human-source]
    paths: ['.github/workflows/source-inspection.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/vowel-human-source
          fetch-depth: 0
      - name: Update cache references and verify content
        run: |
          python3 - <<'PY'
          import json,re,pathlib,subprocess
          root=pathlib.Path('.')
          original=root/'assets/vowel-drive-audio-v3'
          assert len(list(original.glob('*.mp3')))==84
          assert not subprocess.check_output(['git','diff','origin/main','--',str(original)],text=True).strip()
          meta=json.loads((root/'assets/vowel-drive-audio-v4/credits.json').read_text())
          ids={8,11,12,14,22,23,25,35,36,38,52,53,58,70,74,75,80,83}
          assert {x['id'] for x in meta['records']}==ids
          assert all(x['mode']=='full' and x['source_class']=='correct/benar' and not x['human_listening_review'] for x in meta['records'])
          for i in ids:
              for name in [f'{i}.mp3',f'{i}-syllable.mp3']:
                  assert (root/'assets/vowel-drive-audio-v4'/name).stat().st_size>1500
          for p in list(root.glob('games/*/index.html'))+list(root.glob('en/games/*/index.html')):
              s=p.read_text()
              for name,version in [('games',14),('letter-match',11),('vowel-drive',13)]:
                  s=re.sub(r'(/assets/'+name+r'\.js\?v=)\d+',lambda m:m[1]+str(version),s)
              if p.parent.name=='vowel-drive':
                  d=json.loads(re.search(r'<script id="drive-data"[^>]*>([\s\S]*?)</script>',s)[1])
                  assert sum(len(l['rounds']) for l in d['levels'])==261
                  s=s.replace('مراجعة التسجيلات للأهل والمعلمين','مراجعة التسجيلات ومصادر الأصوات').replace('Adult audio review (Arabic)','Adult audio review and audio credits (Arabic)')
              else:
                  for match in re.finditer(r'.{0,100}vowel-drive-audio-v3/(?:25|80)\.mp3.{0,100}',s):
                      print('CHECK CHANGED EXAMPLE',p,match[0])
              p.write_text(s)
          print('All 18 replacement files and 84 original recordings exist; both driving datasets preserved.')
          PY
          for f in assets/vowel-audio-routing.js assets/vowel-drive.js assets/game-extra.js assets/games.js assets/letter-match.js assets/audio-retest-page.js; do node --input-type=module --check < "$f"; done
      - name: Verify audio routing
        run: |
          mkdir -p /tmp/fudool-audio-module
          cp assets/vowel-audio-routing.js assets/vowel-audio-review.js /tmp/fudool-audio-module/
          printf '%s' '{"type":"module"}' > /tmp/fudool-audio-module/package.json
          node --input-type=module <<'JS'
          import {driveAudioSource,sharedAudioSource,repairedFullClips} from 'file:///tmp/fudool-audio-module/vowel-audio-routing.js';
          import fs from 'node:fs';
          if(repairedFullClips.size!==18)throw Error('wrong repaired count');
          for(let id=1;id<=84;id++){const src=driveAudioSource(id),expect='/assets/vowel-drive-audio-v'+(repairedFullClips.has(id)?4:3)+'/'+id+'.mp3';if(src!==expect||!fs.existsSync('.'+src)||sharedAudioSource('/assets/vowel-drive-audio-v3/'+id+'.mp3')!==expect)throw Error('routing '+id)}
          if(driveAudioSource(999)!==null)throw Error('invalid id');
          console.log('84 audio IDs route to existing files; 18 replacements and 66 original clips.')
          JS
      - name: Commit cache reference updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games en/games
          if ! git diff --cached --quiet; then git commit -m "Activate repaired audio on game pages"; git push origin HEAD:development/vowel-human-source; fi
