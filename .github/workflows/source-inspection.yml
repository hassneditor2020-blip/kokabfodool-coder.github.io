name: Inspect licensed Arabic vowel sources
on:
  push:
    branches: [development/vowel-human-source]
    paths: ['.github/workflows/source-inspection.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect data access and original speech segments
        run: |
          python3 - <<'PY'
          import requests
          for u in [
            'https://data.mendeley.com/public-api/datasets/r5fy2dd98g/files?folder_id=root&version=1',
            'https://data.mendeley.com/public-api/datasets/r5fy2dd98g',
            'https://www.kaggle.com/api/v1/datasets/view/amnaasif/arabic-short-vowels-audio-dataset',
            'https://api.datacite.org/dois/10.17632/r5fy2dd98g.1'
          ]:
            try:
              r=requests.get(u,timeout=20);print(u,r.status_code,r.text[:11000])
            except Exception as e:print(u,type(e).__name__,str(e)[:500])
          PY
          for i in 8 11 12 14 22 23 25 35 36 38 52 53 58 70 74 75 80 83; do
            echo "CLIP $i"
            ffmpeg -hide_banner -i assets/vowel-drive-audio-v3/$i.mp3 -af silencedetect=noise=-35dB:d=0.18 -f null - 2>&1 | grep -E 'Duration:|silence_start|silence_end'
          done
