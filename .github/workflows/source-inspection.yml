name: Complete the three missing spoken examples
on:
  push:
    branches: [development/vowel-human-source]
    paths: ['.github/workflows/source-inspection.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/vowel-human-source
      - name: Inspect and append three separately spoken words
        run: |
          python3 -m pip install -q imageio-ffmpeg numpy requests
          python3 -u - <<'PY'
          import pathlib,json,requests,subprocess,imageio_ffmpeg,numpy as np
          ff=imageio_ffmpeg.get_ffmpeg_exe();sr=24000
          def decode(data):
              p=subprocess.run([ff,'-v','error','-i','pipe:0','-ac','1','-ar',str(sr),'-f','f32le','pipe:1'],input=data,capture_output=True,check=True)
              return np.frombuffer(p.stdout,dtype='<f4').copy()
          url='https://resource2.heygen.ai/text_to_speech/6bf7728ad11e4283a4b562744e7c6c0e/033e70e372284077883e538608b65b69/id=68cad424d160479f846426a4d0d4b89f.wav'
          r=requests.get(url,timeout=45);r.raise_for_status();x=decode(r.content);print('Generated words seconds:',len(x)/sr)
          assert 2.2<len(x)/sr<3.0
          # Inspect actual silence, rather than treating text timestamps as guaranteed speech boundaries.
          win=240
          rms=np.sqrt(np.mean(x[:len(x)//win*win].reshape(-1,win)**2,axis=1))
          active=np.where(rms>max(rms)*.035)[0]
          runs=[]
          for i in active:
              if not runs or i-runs[-1][-1]>13:runs.append([int(i)])
              else:runs[-1].append(int(i))
          islands=[(a[0]/100,(a[-1]+1)/100) for a in runs if len(a)>=8]
          print('Detected voice islands:',islands)
          # Use separate word timestamps as anchors only if the three acoustic regions agree.
          expected=[(0.299,.640),(1.024,1.408),(1.835,2.320)]
          assert len(islands)==3, islands
          for (a,b),(c,d) in zip(islands,expected):
              assert a<c+.18 and b>d-.18 and a>c-.23 and b<d+.23,(a,b,c,d)
          out=pathlib.Path('assets/vowel-drive-audio-v4')
          meta=json.loads((out/'credits.json').read_text())
          for id,(start,end),word in zip([14,25,80],islands,['حُوت','ذُبَاب','حَيِيَ']):
              p=out/f'{id}.mp3';original=decode(p.read_bytes());tail=x[max(0,int((start-.055)*sr)):min(len(x),int((end+.055)*sr))]
              assert len(tail)>sr*.16 and np.max(np.abs(tail))>.001
              peak=float(np.max(np.abs(tail)));tail=tail*min(.86/peak,.11/max(float(np.sqrt(np.mean(tail*tail))),.0001))
              combined=np.concatenate([original,np.zeros(int(sr*.26),dtype=np.float32),tail,np.zeros(int(sr*.1),dtype=np.float32)])
              subprocess.run([ff,'-v','error','-y','-f','f32le','-ar',str(sr),'-ac','1','-i','pipe:0','-codec:a','libmp3lame','-b:a','96k',str(p)],input=combined.astype('<f4').tobytes(),check=True)
              row=next(c for c in meta['records'] if c['id']==id)
              row.update({'mode':'full','example_voice':'HeyGen Lamia, generated isolated example; not listening-reviewed','example_segment_seconds':[start,end],'recording_seconds':round(len(decode(p.read_bytes()))/sr,3)})
              assert row['example']==word
              print('Completed',id,word,row['recording_seconds'])
          meta['modifications']+=' Three previously missing or changed example words were newly generated by HeyGen and separated using voice islands and word timestamps. No listening review claimed.'
          (out/'credits.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          p=out/'README.md'
          s=p.read_text().replace('Fifteen recordings retain the original intro and example; three retain only the intro and syllable because the original example was wrong or missing. The corrected examples are shown in writing in the game.','Fifteen recordings retain the original intro and example; three append new HeyGen-generated example words (حُوت، ذُبَاب، حَيِيَ). All eighteen contain three segments. The new examples were matched to timestamps and detected speech regions, not independently listening-reviewed.')
          p.write_text(s)
          PY
      - name: Commit the completed examples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vowel-drive-audio-v4
          git commit -m "Append the three corrected example words"
          git push origin HEAD:development/vowel-human-source
