name: Build repaired vowel recordings
on:
  push:
    branches: [development/vowel-human-source]
    paths: ['.github/workflows/source-inspection.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/vowel-human-source
      - name: Extract and assemble matching human syllables
        run: |
          python3 -m pip install -q imageio-ffmpeg remotezip numpy requests
          python3 -u scripts/repair-vowel-audio.py
      - name: Commit repaired local audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vowel-drive-audio-v4
          git commit -m "Add 18 human-syllable repaired recordings and source attribution"
          git push origin HEAD:development/vowel-human-source
