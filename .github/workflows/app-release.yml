name: Build two Android editions and validate app
on:
  push:
    branches: [development/app-experience-v41]
    paths: ['.github/workflows/app-release.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/app-experience-v41
          fetch-depth: 0
      - name: Build updated web assets and Android packages
        run: |
          python3 -m pip install -q pillow
          python3 scripts/build-pwa.py
          bash scripts/build-android.sh
          node --check assets/pwa.js
          for f in assets/app-experience.js assets/profile-state.js assets/game-progress.js; do node --input-type=module --check < "$f"; done
      - name: Test child dashboard and profile isolation in Chromium
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let pages;
          for(let i=0;i<60;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async(expression,n=150)=>{for(let i=0;i<n;i++){await wait(100);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const check=(v,m)=>{if(!v)throw Error(m)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:850,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['', '/en']){
              await nav(pre+'/play-app/',"document.querySelectorAll('.app-game-card').length===20");
              await ev("localStorage.clear();localStorage.setItem('fudool-games-v1:counting',JSON.stringify({scores:[3],lastPlayed:1}));true");
              await cmd('Page.reload');await poll("document.querySelector('.app-stat strong')?.textContent==='3'");
              await poll("Array.from(document.querySelectorAll('.app-game-art svg')).every(x=>x.getBBox().width>0)");
              check(await ev("document.documentElement.scrollWidth<=innerWidth+4 && document.querySelector('.pwa-bottom-nav').getBoundingClientRect().height>0"),'dashboard layout');
              await ev("document.querySelector('.app-tab[data-category=math]').click();true");
              check(await ev("Array.from(document.querySelectorAll('.app-game-card:not([hidden])')).every(x=>x.dataset.category==='math')"),'category filter');
              await nav(pre+'/app/family/',"document.querySelectorAll('.app-report-row').length===20");
              await ev("document.querySelector('[name=nickname]').value='Star';document.querySelector('[name=avatar]').value='lumaa';document.querySelector('[name=age]').value='3-5';document.querySelector('form').requestSubmit();true");
              await poll("document.querySelector('[data-family-name]')?.textContent==='Star'");
              check(await ev("document.querySelector('.app-stat strong').textContent==='0'"),'new profile inherited default progress');
              await nav(pre+'/games/counting/',"document.querySelector('[data-level-list]')?.children.length>0");
              await ev("document.querySelector('.game-level:not(:disabled)').click();true");
              await poll("!document.querySelector('[data-game]').hidden");
              check(await ev("Object.keys(localStorage).some(k=>k.startsWith('fudool-profile-v1:')&&k.endsWith(':game:counting'))"),'profile progress not isolated');
              await nav(pre+'/app/family/',"document.querySelectorAll('.app-profile-choice').length===2");
              await ev("document.querySelector('.app-profile-choice').click();true");
              await poll("document.querySelector('.app-stat strong')?.textContent==='3'");
              await nav(pre+'/app/',"document.querySelectorAll('.apk-card a[download]').length===2");
              check(await ev("document.documentElement.scrollWidth<=innerWidth+4 && Array.from(document.querySelectorAll('.apk-card a')).every(x=>x.href.endsWith('.apk'))"),'APK links or layout');
              await ev("localStorage.clear();true");
              console.log(width,pre||'ar','dashboard, 20 illustrations, filters, separate profile and download page passed');
            }
          }
          ws.close()
          JS
      - name: Commit built assets and signed APKs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Build V4.1 app experience and two signed Android previews"
          git push origin HEAD:development/app-experience-v41
