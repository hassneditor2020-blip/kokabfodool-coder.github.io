name: Test sound detective browser
on:
  push:
    branches: [development/real-sounds-v39]
    paths: ['.github/workflows/real-sounds-build.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real browser sound and picture interactions
        run: |
          python3 -m http.server 8765 >/tmp/fudool-server.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required --remote-debugging-port=9222 --user-data-dir=/tmp/fudool-chrome about:blank >/tmp/fudool-chrome.log 2>&1 &
          node --input-type=module <<'JS'
          const wait=ms=>new Promise(r=>setTimeout(r,ms));let pages;for(let i=0;i<40;i++){try{pages=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await wait(250)}}
          if(!pages)throw Error('Chrome unavailable');
          const ws=new WebSocket(pages.find(p=>p.type==='page').webSocketDebuggerUrl);await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const [r,j]=pending.get(m.id);pending.delete(m.id);m.error?j(m.error):r(m.result)}};
          const cmd=(method,params={})=>new Promise((r,j)=>{const id=++seq;pending.set(id,[r,j]);ws.send(JSON.stringify({id,method,params}))});
          const ev=async expression=>{const r=await cmd('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(JSON.stringify(r.exceptionDetails));return r.result.value};
          const poll=async expression=>{for(let i=0;i<90;i++){await wait(80);const v=await ev(expression);if(v)return v}throw Error('Timed out: '+expression)};
          const nav=async(path,ready)=>{const url='http://127.0.0.1:8765/'+path;await cmd('Page.navigate',{url});return poll("location.href==="+JSON.stringify(url)+" && ("+ready+")")};
          const check=(v,m)=>{if(!v)throw Error(m)};
          await cmd('Page.enable');await cmd('Runtime.enable');
          for(const width of [360,1280]){
            await cmd('Emulation.setDeviceMetricsOverride',{width,height:900,deviceScaleFactor:1,mobile:width===360});
            for(const pre of ['','en/']){
              await nav(pre+'games/sound-quiz/?level=1',"document.querySelector('.sound-play') && !document.querySelector('[data-game]').hidden");
              check(await ev("document.querySelectorAll('.sound-option:disabled').length===3"),'answers must wait for audio');
              await poll("Array.from(document.querySelectorAll('.sound-picture')).every(s=>s.getBBox().width>0)");
              for(let i=0;i<4;i++){
                const answer=await ev("JSON.parse(document.querySelector('#game-data').textContent).levels[0].rounds["+i+"].answer");
                await ev("document.querySelector('.sound-play').click();true");
                await poll("document.querySelectorAll('.sound-option:not(:disabled)').length>=2");
                if(i===0){
                  await ev("Array.from(document.querySelectorAll('.sound-option')).find(b=>b.dataset.soundChoice!=="+JSON.stringify(answer)+").click();true");
                  check(await ev("document.querySelector('[data-feedback]').dataset.state==='wrong' && document.querySelector('[data-next]').hidden"),'wrong choice advances');
                  await poll("!document.querySelector('.sound-play').disabled");
                  await ev("document.querySelector('.sound-play').click();true");
                }
                await ev("Array.from(document.querySelectorAll('.sound-option')).find(b=>b.dataset.soundChoice==="+JSON.stringify(answer)+").click();true");
                check(await ev("!document.querySelector('[data-next]').hidden && document.querySelector('.sound-option[data-state=correct]') && document.documentElement.scrollWidth<=innerWidth+4"),'correct answer or layout');
                await ev("document.querySelector('[data-next]').click();true");
                if(i<3)await poll("document.querySelector('.sound-play') && document.querySelector('[data-next]').hidden");
              }
              await poll("!document.querySelector('[data-level-result]').hidden");
              check(await ev("JSON.parse(localStorage.getItem('fudool-games-v1:sound-quiz')).scores[0]===2"),'stars not saved');
              await ev("localStorage.clear();true");
              console.log(width,pre||'ar','actual audio, wrong choice, replay, correct selection, level completion, stars passed');
            }
          }
          await nav('games/sound-quiz/?level=1',"document.querySelector('.sound-play')");
          const files=await ev(`(async()=>{const data=JSON.parse(document.querySelector('#game-data').textContent),paths=[...new Set(data.levels.flatMap(l=>l.rounds.map(q=>q.audio)))];const out=[];for(const src of paths){const a=new Audio();a.preload='metadata';a.src=src;await new Promise((r,j)=>{a.onloadedmetadata=r;a.onerror=()=>j(Error(src))});out.push({src,duration:a.duration});a.src=''}return out})()`);
          check(files.length===19&&files.every(f=>Number.isFinite(f.duration)&&f.duration>.35),JSON.stringify(files));
          ws.close();console.log('19 sound files decode in Chromium; 4 complete levels tested with actual playback.');
          JS
